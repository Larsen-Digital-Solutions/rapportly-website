<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Eksempelrapport – Rapportly</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Uten skript (for eksempel e-postfiltre som sjekker lenken): rett til PDF-en, uten å telle. -->
  <noscript><meta http-equiv="refresh" content="0;url=/eksempelrapport.pdf"></noscript>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #fff; color: #14213d; }
    p { font-size: 15px; padding: 0 16px; text-align: center; }
    a { color: #14213d; }
  </style>
</head>
<body>
  <!-- Lenken i cold e-posten og på nettsiden går hit (?kilde=epost / ?kilde=nettside).
       Siden teller åpningen (teller.js → nettside-teller) og sender videre til PDF-en,
       som Vercel ellers ikke teller. -->
  <p>Åpner eksempelrapporten … <a href="/eksempelrapport.pdf">Trykk her</a> hvis ingenting skjer.</p>
  <script src="/teller.js"></script>
  <script>
    (function () {
      var ferdig = false;
      function videre() {
        if (ferdig) return;
        ferdig = true;
        location.replace('/eksempelrapport.pdf');
      }
      var kilde = new URLSearchParams(location.search).get('kilde') || 'annet';
      var telling = window.rapportlyTell ? window.rapportlyTell('eksempelrapport', kilde) : null;
      if (telling && telling.then) telling.then(videre, videre);
      // Svarer ikke telleren, venter vi ikke på den.
      setTimeout(videre, 1200);
    })();
  </script>
</body>
</html>
